        return `<tr${isBot ? ' class="bot" title="Setzt immer auf den Quotenfavoriten"' : ''}><td>${isBot ? '' : i + 1 + '.'}</td><td>${r.p.name}</td><td>${r.n}</td><td>${r.hits} (${Math.round(r.hits / r.n * 100)} %)</td><td>${r.n},00 €</td><td><b class="${r.profit >= 0 ? 'pos-pos' : 'pos-neg'}">${eur(r.profit)}</b></td><td>${(r.profit / r.n * 100).toFixed(1).replace('.', ',')} %</td><td>${isBot ? '–' : ptsRank.get(r.p.id) + '.'}</td></tr>`;
      }).join('');
    rcard.append(t, $('p', 'note', `Annahme: 1 € auf die Tendenz (Heim/Remis/Gast) jedes Tipps; ${played.length} gespielte Spiele mit Quoten. Nur Spiele, bei denen der Spieler getippt hat. ${BOT} (Referenz): setzt immer auf den Quotenfavoriten. Quoten sind der Stand zum Zeitpunkt des Abrufs und können vom Stand bei Anpfiff abweichen.`));
    root.append(rcard);
    return root;
  },

  'Quoten'() {
    const withOdds = D.matches.filter(m => m.odds);
    const root = $('div');
    if (!withOdds.length) {
      root.append($('div', 'card', '<h2>Wettquoten</h2><p class="note">Noch keine Quoten in data.json. Dafür <code>KICKTIPP_EMAIL</code> und <code>KICKTIPP_PASSWORD</code> setzen.</p>'));
      return root;
    }
    const outcome = t => ['h', 'd', 'a'][1 - sign(t)];       // sign 1 = Heimsieg
    const prob = o => { const r = [1 / o.h, 1 / o.d, 1 / o.a], s = r[0] + r[1] + r[2]; return r.map(x => x / s); };
    const pc = v => Math.round(v * 100) + ' %';

    // Spielübersicht: Buchmacher-Wahrscheinlichkeit vs. Tippverteilung
    const mcard = $('div', 'card', `<h2>Quoten vs. Tippverteilung (${withOdds.length} Spiele)</h2>`);
    const sel = $('select', null, '<option value="all">Alle Spieltage</option>' + [...new Set(withOdds.map(m => m.matchday))].map(d => `<option value="${d}">${d}. Spieltag</option>`).join(''));
    const bar = $('div', 'row'); bar.append(sel);
    const mt = $('div');
    const drawMatches = () => {
      const ms = withOdds.filter(m => sel.value === 'all' || m.matchday == sel.value);
      const t = $('table');
      t.innerHTML = '<tr><th>Spiel</th><th>Quote 1</th><th>X</th><th>2</th><th>Buchm. 1/X/2</th><th>Tipper 1/X/2</th><th>Ergebnis</th></tr>' + ms.map(m => {
        const tips = D.tips.filter(x => x.match === m.id);
        const share = [1, 0, -1].map(sg => tips.length ? tips.filter(x => sign(x.tip) === sg).length / tips.length : 0);
        const fav = prob(m.odds);
        return `<tr><td>${m.matchday}. ${m.home} – ${m.away}</td><td>${m.odds.h.toFixed(2)}</td><td>${m.odds.d.toFixed(2)}</td><td>${m.odds.a.toFixed(2)}</td><td>${fav.map(pc).join(' / ')}</td><td>${tips.length ? share.map(pc).join(' / ') : '–'}</td><td>${m.result ? m.result.join(':') : '–'}</td></tr>`;
      }).join('');
      mt.replaceChildren(t);
    };
    sel.onchange = drawMatches; drawMatches();
    mcard.append(bar, mt, $('p', 'note', 'Buchmacher-Wahrscheinlichkeiten ohne Marge (Kehrwerte normiert). Quoten: Wettanbieter-Einblendung auf der Tippabgabe.'));

    // Spieler: Mut zum Außenseiter
    const rows = D.players.map(p => {
      const ts = D.tips.filter(t => t.player === p.id && byMatch.get(t.match).odds);
      let q = 0, favs = 0, under = 0, underHit = 0, hits = 0;
      for (const t of ts) {
        const o = byMatch.get(t.match).odds, k = outcome(t.tip);
        q += o[k];
        if (o[k] === Math.min(o.h, o.d, o.a)) favs++;
        if (o[k] >= 3.5) { under++; if (t.points) underHit++; }
        if (t.points) hits++;
      }
      const n = ts.length || 1;
      return { name: p.name, n: ts.length, q: q / n, favs: favs / n, under, underHit };
    }).filter(r => r.n).sort((a, b) => b.q - a.q);
    const pcard = $('div', 'card', '<h2>Mut zum Risiko</h2>');
    const t2 = $('table');
    t2.innerHTML = '<tr><th>Spieler</th><th>Tipps</th><th>Ø Quote des Tipps</th><th>Favorit getippt</th><th>Tipps auf Quote ≥ 3,5</th><th>davon gepunktet</th></tr>' +
      rows.map(r => `<tr><td>${r.name}</td><td>${r.n}</td><td>${r.q.toFixed(2)}</td><td>${pc(r.favs)}</td><td>${r.under}</td><td>${r.underHit}</td></tr>`).join('');
    pcard.append(t2, $('p', 'note', 'Sortiert nach Ø Quote des getippten Ausgangs (Heim/Remis/Gast): hoch = risikofreudiger Tipper.'));
    root.append(mcard, pcard);
    return root;
  }
};

// Tabellenspitze im Kopfband
function leaders() {
  if (!playedDays.length) return;
  const { cum, cmp, order } = standings(), tot = id => cum.get(id).at(-1);
  const sorted = order(), lead = tot(sorted[0].id);
  const rows = sorted.slice(0, 3).map(p => {
    const pos = 1 + sorted.filter(q => cmp()(q, p) < 0).length, gap = lead - tot(p.id);
    return `<li><span class="pos">${pos}</span><span class="nm">${p.name}</span><span class="pt">${tot(p.id)}</span><span class="gap">${gap ? '−' + gap : ''}</span></li>`;
  }).join('');
  document.getElementById('leaders').innerHTML = `<span class="cap" id="lt">Tabelle nach dem ${playedDays.at(-1)}. Spieltag</span><ol class="table-top" aria-labelledby="lt">${rows}</ol>`;
}

async function main() {
  prepare(await (await fetch('data.json')).json());
  document.getElementById('title').textContent = D.title;
  const stand = new Date(D.fetchedAt).toLocaleString('de-DE', { day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' });
  document.getElementById('meta').textContent = `${D.players.length} Spieler, ${finished.length} gespielte Spiele. Stand: ${stand} Uhr`;
  leaders();
  initFocus(standings().order());
  const css = getComputedStyle(document.documentElement);
  Object.assign(Chart.defaults, { color: css.getPropertyValue('--muted').trim(), borderColor: css.getPropertyValue('--line-soft').trim() });
  Chart.defaults.font.family = css.getPropertyValue('--body').trim();
  Chart.defaults.font.size = 13;
  Chart.defaults.plugins.tooltip.padding = 10;
  const nav = document.getElementById('tabs'), view = document.getElementById('view');
  const header = document.querySelector('.pitch');
  const stick = () => header.style.top = (nav.offsetHeight - header.offsetHeight) + 'px';
  addEventListener('resize', stick); stick();
  const show = name => {
    nav.querySelectorAll('button').forEach(b => { const on = b.textContent === name; b.setAttribute('aria-selected', on); if (on) nav.scrollTo({ left: b.offsetLeft - (nav.clientWidth - b.offsetWidth) / 2 }); });
    view.replaceChildren(views[name]()); location.hash = name;
    if (scrollY > header.offsetHeight - nav.offsetHeight) scrollTo(0, header.offsetHeight - nav.offsetHeight);
  };
  const names = Object.keys(views).filter(n => hasOdds || !['Wettgewinn', 'Quoten'].includes(n));
  names.forEach(n => { const b = $('button', null, n); b.role = 'tab'; b.onclick = () => show(n); nav.append(b); });
  const hash = decodeURIComponent(location.hash.slice(1));
  show(names.includes(hash) ? hash : 'Verlauf');
  if (playedDays.length) newsModal(() => show('News'));
}

// Meldungen des aktuellen Spieltags bei jedem Seitenaufruf, eine nach der anderen
function newsModal(toTab) {
  const d = playedDays.at(-1), { done, items } = news(d, standings());
  const dlg = $('dialog', 'news'), head = $('div', 'nm-head', `<b>Tipp-Rundschau</b><span>${d}. Spieltag${done ? '' : ' · vorläufig'}</span>`);
  const x = $('button', 'x', '×'), body = $('div', 'nm-body'), foot = $('div', 'nm-foot'), dots = $('div', 'nm-dots');
  const all = $('button', 'all', 'Alle Meldungen'), go = $('button', 'go');
  x.setAttribute('aria-label', 'Schließen'); dlg.setAttribute('aria-label', 'Tipp-Rundschau');
  body.setAttribute('aria-live', 'polite');
  head.append(x); foot.append(dots, all, go); dlg.append(head, body, foot);
  let k = 0;
  const draw = () => {
    const s = items[k];
    body.className = 'nm-body ' + s.tone; void body.offsetWidth; body.classList.add('in');      // Animation neu starten
    body.innerHTML = `<span class="ic" aria-hidden="true">${s.icon}</span><span class="kicker">${s.kicker}</span><h3>${s.head}</h3><p>${s.text}</p>`;
    dots.innerHTML = items.map((_, j) => `<i class="${j === k ? 'on' : ''}"></i>`).join('');
    dots.setAttribute('aria-label', `Meldung ${k + 1} von ${items.length}`);
    go.textContent = k < items.length - 1 ? 'Nächste Meldung →' : 'Zur Auswertung';
  };
  go.onclick = () => { if (++k < items.length) draw(); else dlg.close(); };
  x.onclick = () => dlg.close();
  all.onclick = () => { dlg.close(); toTab(); };
  dlg.onclick = e => { if (e.target === dlg) dlg.close(); };      // Klick auf den Hintergrund
  dlg.onclose = () => dlg.remove();
  draw(); document.body.append(dlg); dlg.showModal(); go.focus();
}
main().catch(e => { document.getElementById('view').textContent = 'Fehler: ' + e.message + ' (data.json fehlt? Erste Aktualisierung abwarten bzw. `node export/export.mjs` ausführen)'; });
</script>
